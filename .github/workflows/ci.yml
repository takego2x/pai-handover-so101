name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned runtime
        run: docker compose build
      - name: Lesson tests (unit tests + L1 theory check + L7 learned policy on 30 test parts)
        run: docker compose run --rm sim python -m pytest -q tests
