# カメラ → VLM → 計画 → 実行 → 記録。ノード同士は Apache Arrow の配列でつながる（第6回）。
# 起動: dora run dora/dataflow.yml
nodes:
  - id: camera
    path: camera.py
    inputs:
      tick: dora/timer/millis/2000      # 2 秒ごとに次のトレイを撮る
    outputs: [image]
    env:
      N_TRAYS: "3"

  - id: vlm
    path: vlm_node.py
    inputs:
      image: camera/image
    outputs: [parts]
    # 既定は replay（保存済みの応答。キー不要）。実際に呼ぶとき: VLM_BACKEND=gemini dora run dora/dataflow.yml

  - id: planner
    path: planner.py
    inputs:
      parts: vlm/parts
    outputs: [plan]

  - id: executor
    path: executor.py
    inputs:
      plan:
        source: planner/plan
        queue_size: 100                 # 取りこぼさない。既定のままだと、実行が遅い間に古い計画が黙って捨てられた
    outputs: [result]

  - id: monitor
    path: monitor.py
    inputs:
      parts:
        source: vlm/parts
        queue_size: 100
      result:
        source: executor/result
        queue_size: 100
