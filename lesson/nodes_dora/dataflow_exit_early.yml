# L8（わざと失敗）: 第一層が「送ったらすぐ終了」する版。それ以外は dataflow.yml と同じ。
# L8a: dora-rs で配線する。第一層 3 台 → 第二層 1 台 → 記録。
# 起動（作業場所の直下で）: docker compose run --rm sim bash -c "cd lesson/nodes_dora && dora run dataflow.yml"
# ノード同士は Apache Arrow の配列でつながる。ここでは JSON の文字列を 1 つ入れた配列を送る。
nodes:
  - id: layer1_0
    path: layer1.py
    inputs:
      tick: dora/timer/millis/500        # 起動の合図（最初の 1 回だけ使う）
      done: monitor/done                 # 記録ノードの「全部届いた」。これを受け取るまで終了しない
    outputs: [part_data]
    env: {CELL: "0", N_PARTS: "5", MISTAKE: exit_early}

  - id: layer1_1
    path: layer1.py
    inputs:
      tick: dora/timer/millis/500
      done: monitor/done
    outputs: [part_data]
    env: {CELL: "1", N_PARTS: "5", MISTAKE: exit_early}

  - id: layer1_2
    path: layer1.py
    inputs:
      tick: dora/timer/millis/500
      done: monitor/done
    outputs: [part_data]
    env: {CELL: "2", N_PARTS: "5", MISTAKE: exit_early}

  - id: layer2
    path: layer2.py
    inputs:                              # 3 台の第一層から受け取る。queue_size を大きくして取りこぼさない
      from0: {source: layer1_0/part_data, queue_size: 100}
      from1: {source: layer1_1/part_data, queue_size: 100}
      from2: {source: layer1_2/part_data, queue_size: 100}
    outputs: [result]
    env: {POLICY: learned}               # 第二層の方策：learned（L7 で学習）か formula（式・接線向き）

  - id: monitor
    path: monitor.py
    outputs: [done]
    inputs:
      result: {source: layer2/result, queue_size: 100}
    env: {EXPECTED: "15"}                # 第一層 3 台 × 5 個。届いた数と比べる
